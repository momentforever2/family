<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們家的行事曆</title>
<meta name="theme-color" content="#2f6b55">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  // ↓↓ 你的 Google Apps Script 網址（/exec 結尾） ↓↓
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxAotVJvKkQEbH_PH8C4FFwobU3Oa9AsXT0YsLNj8aFIUp2y4aCurVYFpjpDEda0d80/exec';
  // 從桌面圖示打開時，直接進入 app
  const fromIcon = new URLSearchParams(location.search).has('app') ||
    window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (fromIcon) location.replace(APP_URL);
</script>
<style>
  :root{--bg:#f3f5f2;--fg:#1f2a24;--muted:#617066;--accent:#2f6b55}
  @media (prefers-color-scheme:dark){:root{--bg:#141a17;--fg:#e6ece8;--muted:#9aaba1;--accent:#7cc4a6}}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  main{max-width:420px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:0;font-size:1.4rem}
  p{margin:0;color:var(--muted);line-height:1.6}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px}
  ol{text-align:left;color:var(--muted);line-height:1.8;padding-left:1.2em;margin:0}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>我們家的行事曆</h1>
  <p>把這頁加到手機主畫面，以後點圖示就會直接打開。</p>
  <ol>
    <li>Android Chrome：右上角「⋮」→「加到主畫面」或「安裝應用程式」</li>
    <li>iPhone Safari：下方「分享」→「加入主畫面」</li>
  </ol>
  <a class="btn" id="go">現在直接開啟</a>
</main>
<script>document.getElementById('go').href = APP_URL;</script>
</body>
</html>
