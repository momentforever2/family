<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們家的行事曆</title>
<meta name="theme-color" content="#2f6b55">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#f3f5f2;font-family:system-ui,"Noto Sans TC",sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #help{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#1f2a24;color:#fff;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  #help a{color:#fff;background:#2f6b55;padding:6px 12px;border-radius:8px;text-decoration:none;white-space:nowrap}
  #help button{background:none;border:0;color:#9aaba1;font-size:18px}
</style>
</head>
<body>
<!-- ↓↓ 把這裡換成你的 Apps Script 網址（/exec 結尾） ↓↓ -->
<script>const APP_URL = 'https://script.google.com/macros/s/AKfycbxAotVJvKkQEbH_PH8C4FFwobU3Oa9AsXT0YsLNj8aFIUp2y4aCurVYFpjpDEda0d80/exec';</script>

<iframe id="app" title="我們家的行事曆" allow="clipboard-write"></iframe>
<div id="help" hidden>
  <span>畫面空白或要求登入？</span>
  <a id="direct" target="_top">直接開啟</a>
  <button aria-label="關閉" onclick="this.parentNode.hidden=true;try{localStorage.setItem('helpOff','1')}catch(e){}">✕</button>
</div>
<script>
  document.getElementById('app').src = APP_URL;
  document.getElementById('direct').href = APP_URL;
  // 嵌入的畫面如果因為登入問題打不開，8 秒後顯示「直接開啟」備用按鈕
  let off=false; try{ off=localStorage.getItem('helpOff')==='1'; }catch(e){}
  if(!off) setTimeout(() => { document.getElementById('help').hidden = false; }, 8000);
</script>
</body>
</html>
